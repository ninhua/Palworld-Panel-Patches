source:
  repository: Jiaayu/palworld-panel
  pinned_commit: ""
  role: feature-reference
  license_status: unconfirmed

target:
  project: uitok-palworld-panel

features:
  - id: base-custom-names
    reference_label: 据点重命名
    status: implemented-independently
    patch_version: 0.2.0-dev.1
    implementation: behavior-reimplementation
    source_paths: []
    target_paths:
      - backend/internal/api/base_custom_names.go
      - backend/internal/api/save_index.go
      - backend/internal/api/routes.go
      - frontend/src/api/bases.ts
      - frontend/src/pages/Bases.tsx
    notes: Stores display aliases in PalPanel KV storage; does not modify Palworld save files and copies no source code from the reference repository.

  - id: base-storage-browser
    reference_label: 据点仓库浏览
    status: implemented-independently
    patch_version: 0.3.2-dev.1
    implementation: behavior-reimplementation
    source_paths: []
    target_paths:
      - backend/internal/api/save_index.go
      - backend/internal/api/base_storage_test.go
      - backend/internal/pallocalize/localize.go
      - frontend/src/api/bases.ts
      - frontend/src/api/bases.test.ts
      - frontend/src/pages/Bases.tsx
      - frontend/src/types/index.ts
    notes: Uses the target project's read-only base storage endpoint, resolves map-object containers linked by the base record, enriches them with localized container names and bundled item icons, and adds an independent browser UI; no source code is copied from the reference repository and no save data is modified.

  - id: player-notes
    reference_label: 玩家备注与标签
    status: implemented-independently
    patch_version: 0.4.0-dev.1
    implementation: behavior-reimplementation
    source_paths: []
    target_paths:
      - backend/internal/api/player_annotations.go
      - backend/internal/api/save_index.go
      - backend/internal/api/routes.go
      - frontend/src/api/players.ts
      - frontend/src/pages/Players.tsx
      - frontend/src/types/index.ts
    notes: Stores save-source-scoped management notes and tags in PalPanel KV storage, supports search and permission-gated editing, copies no source code from the reference repository, and does not modify player save files.

  - id: guild-detail-browser
    reference_label: 公会详情浏览
    status: implemented-independently
    patch_version: 0.5.0-dev.1
    implementation: behavior-reimplementation
    source_paths: []
    target_paths:
      - backend/internal/api/guild_detail.go
      - backend/internal/api/save_index.go
      - frontend/src/api/guilds.ts
      - frontend/src/pages/Guilds.tsx
      - frontend/src/types/index.ts
    notes: Enriches the target project's existing read-only guild detail endpoint with member annotations and linked base metadata, copies no source code from the reference repository, and performs no save mutation.

  - id: player-summary
    reference_label: 玩家存档概览与中文区域定位
    status: implemented-independently
    patch_version: 0.8.16
    implementation: behavior-reimplementation
    source_paths: []
    target_paths:
      - backend/internal/api/player_summary_feature.go
      - frontend/src/lib/playerRegion.ts
      - frontend/src/pages/PlayerSummary.tsx
      - frontend/src/components/ui/SaveDataTabs.tsx
      - frontend/src/routes.tsx
    notes: Reuses the target project's existing player archive, indexed Pals, WorldID-scoped presence history, and verified live-map coordinate projection. It shows level, guild, owned Pal counts, Pal level summaries, online duration, raw coordinates, and broad Chinese region estimates. Metrics not emitted by the locked sav-cli, including technology, recipe, Paldeck, and boss progress, are explicitly omitted rather than inferred. No Jiaayu source code is copied and no save data is modified.

  - id: base-worker-browser
    reference_label: 基地工作帕鲁浏览
    status: implemented-independently
    patch_version: 0.6.0-dev.1
    implementation: behavior-reimplementation
    source_paths: []
    target_paths:
      - backend/internal/api/base_workers.go
      - backend/internal/api/save_index.go
      - backend/internal/api/routes.go
      - frontend/src/api/bases.ts
      - frontend/src/pages/Bases.tsx
      - frontend/src/types/index.ts
    notes: Adds a read-only base worker endpoint and browser, merges indexed Pal details by instance ID, displays only fields present in the locked index, copies no source code from the reference repository, and performs no save mutation.

  - id: base-feed-box-summary
    reference_label: 基地饲料箱摘要
    status: implemented-independently
    patch_version: 0.7.0-dev.1
    implementation: behavior-reimplementation
    source_paths: []
    target_paths:
      - backend/internal/api/base_feed_boxes.go
      - backend/internal/api/save_index.go
      - backend/internal/api/routes.go
      - frontend/src/api/bases.ts
      - frontend/src/pages/Bases.tsx
      - frontend/src/types/index.ts
    notes: Adds a read-only feed-box summary endpoint and browser, filters feed-box container types, aggregates item quantities across boxes, copies no source code from the reference repository, and performs no save mutation.
  - id: insecure-endpoint-support
    reference_label: 非 HTTPS 服务端点兼容
    status: implemented-independently
    patch_version: 0.8.0-dev.1
    implementation: behavior-reimplementation
    source_paths: []
    target_paths:
      - astrbot_plugin_palpanel/main.py
      - astrbot_plugin_palpanel/security.py
      - backend/internal/aitranslation/service.go
      - backend/internal/appconfig/config.go
      - backend/internal/astrbotclient/client.go
      - backend/internal/mods/downloader.go
      - backend/internal/mods/importer.go
      - backend/internal/server/webdav.go
      - frontend/src/pages/Backups.tsx
      - frontend/src/pages/Mods.tsx
      - frontend/src/pages/Settings.tsx
    notes: Adds explicit HTTP/HTTPS support for configurable AstrBot, WebDAV, AI-provider, upstream/download, and public remote Mod endpoints while retaining URL, credential, redirect, public-address, remote-path, and size validation. HTTP transport is not encrypted.


  - id: global-inventory-browser
    reference_label: 全服库存管理
    status: implemented-independently
    patch_version: 0.8.9
    implementation: behavior-reimplementation
    source_paths: []
    target_paths:
      - backend/internal/api/global_inventory.go
      - backend/internal/api/routes.go
      - frontend/src/api/inventory.ts
      - frontend/src/pages/Inventory.tsx
      - frontend/src/routes.tsx
      - frontend/src/components/layout/Sidebar.tsx
    notes: Aggregates the target project's existing localized save-index container slots across player, base-linked, and unresolved owners. It is read-only, copies no Jiaayu source code, does not extend sav-cli, and does not modify Palworld saves.

  - id: new-player-starter-gift
    reference_label: 新玩家初始礼包
    status: implemented-independently
    patch_version: 0.8.13
    implementation: behavior-reimplementation
    source_paths: []
    target_paths:
      - backend/internal/startergift/service.go
      - backend/internal/api/starter_gift.go
      - backend/internal/api/routes.go
      - backend/internal/monitor/player_presence.go
      - backend/internal/playerpresence/scope.go
      - frontend/src/api/starterGift.ts
      - frontend/src/pages/StarterGift.tsx
      - frontend/src/pages/PlayerCenter.tsx
      - frontend/src/routes.tsx
    notes: Detects previously unseen players through the target project's existing presence sampler, resolves the active world from DedicatedServerName, and isolates presence sessions, starter-gift configuration, progress, and serialized workers by WorldID. New worlds inherit the latest configuration template without overwriting existing worlds. The page uses a sidebar entry, tabbed workspaces, local item icons, Pal portraits whose identity comes from each template JSON PalID, optional same-directory index JSON files for category/Chinese/English display and list-based filters, refined categories, inline quantities, and a sticky save summary. Templates not present in an index retain their filename as the display fallback. It copies no Jiaayu source code and does not modify Palworld saves.
  - id: unattended-inventory-delta
    reference_label: 无人时段库存净增加
    status: implemented-independently
    patch_version: 0.8.14
    implementation: behavior-reimplementation
    source_paths: []
    target_paths:
      - backend/internal/unattendedinventory/state.go
      - backend/internal/unattendedinventory/saveindex.go
      - backend/internal/monitor/player_presence.go
      - backend/internal/api/unattended_inventory.go
      - backend/internal/api/global_inventory.go
      - frontend/src/api/inventory.ts
      - frontend/src/pages/Inventory.tsx
    notes: Reuses the target project's 15-second player presence sampler and read-only global save index, requires a five-minute no-player interval, resets after observation gaps, stores state per WorldID, and reports only positive inventory net changes. It copies no Jiaayu source code and does not modify Palworld saves.
